<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In · Agentic AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Inter:wght@300;400;500&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#0a0b0d;
    --ink:#f3f1ea;
    --muted:rgba(243,241,234,0.62);
    --hairline:rgba(243,241,234,0.18);
    --accent:#e6c98a;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; overflow:hidden; }

  /* ---------- background video ---------- */
  #bg-video{
    position:fixed; inset:0; z-index:0; width:100%; height:100%;
    object-fit:cover; object-position:center;
  }

  .vignette{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(120% 100% at 50% 42%, transparent 40%, rgba(6,9,7,0.62) 100%),
      linear-gradient(180deg, rgba(6,9,7,0.55) 0%, transparent 22%, transparent 62%, rgba(6,9,7,0.6) 100%);
  }
  .scrim{
    position:fixed; z-index:1; pointer-events:none;
    left:50%; top:52%; transform:translate(-50%,-50%);
    width:min(1100px,94vw); height:min(640px,86vh);
    background:radial-gradient(60% 55% at 50% 50%, rgba(6,9,7,0.55) 0%, transparent 72%);
    filter:blur(8px);
  }

  /* ---------- shell ---------- */
  .shell{ position:relative; z-index:5; display:flex; flex-direction:column; height:100vh; }

  .nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:1.3vh clamp(24px,5vw,64px);
    flex:0 0 auto;
  }
  .wordmark{ font-family:'Manrope',sans-serif; font-weight:600; font-size:clamp(15px,2vh,20px); letter-spacing:0.12em; }
  .wordmark em{ font-style:normal; color:var(--accent); }

  .hero{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 20px; overflow:hidden; }

  .eyebrow{
    display:flex; align-items:center; gap:9px; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:clamp(9px,1.1vh,11px); letter-spacing:0.3em; text-transform:uppercase;
    color:var(--accent); margin:0 0 0.8vh; flex:0 0 auto;
  }
  .eyebrow .dot{ width:5px; height:5px; border-radius:50%; background:var(--accent); box-shadow:0 0 12px var(--accent); }

  h1{
    font-family:'Manrope',sans-serif; font-weight:500; font-size:clamp(24px,4.2vh,46px);
    line-height:0.98; letter-spacing:-0.01em; margin:0; color:var(--ink); flex:0 0 auto;
  }
  h1 em{ font-style:normal; font-weight:700; color:var(--accent); }

  .sub{
    font-family:'Inter',sans-serif; font-weight:300; font-size:clamp(12px,1.5vh,15px);
    color:var(--muted); margin:0.6vh 0 0; flex:0 0 auto;
  }

  .footer-caption{
    text-align:center; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:clamp(9px,1vh,11px); letter-spacing:0.18em;
    color:var(--muted); padding:0 24px; margin:0.5vh 0 1vh; flex:0 0 auto;
  }

  /* ---------- entrance motion ---------- */
  @keyframes blurFadeUp{
    from{ opacity:0; filter:blur(16px); transform:translateY(28px); }
    to{ opacity:1; filter:blur(0); transform:translateY(0); }
  }
  .rise{ opacity:0; animation:blurFadeUp 1s cubic-bezier(.2,.7,.2,1) forwards; }
  @media (prefers-reduced-motion:reduce){
    .rise{ opacity:1; animation:none; filter:none; transform:none; }
  }

  /* ============================================================
     The functional sign-in widget: a water drop falls, ripples
     spread, and the sign-in card rises out of the ripple — ties
     directly into the ripple footage already playing behind it.
     ============================================================ */
  .pool{ position:relative; width:min(640px, 92vw); height:clamp(400px, 60vh, 560px); margin:1vh auto 0; flex:0 1 auto; }

  .water-surface{
    position:absolute; left:50%; top:62%; transform:translate(-50%,-50%);
    width:210px; height:64px; border-radius:50%;
    background:radial-gradient(ellipse, rgba(230,201,138,0.14) 0%, rgba(230,201,138,0.04) 60%, transparent 80%);
    filter:blur(2px); pointer-events:none;
  }

  .droplet{
    position:absolute; left:50%; top:4%; margin-left:-8px;
    width:16px; height:16px; background:var(--accent);
    border-radius:0 50% 50% 50%; transform:rotate(45deg) scale(1);
    box-shadow:0 0 14px rgba(230,201,138,.5);
    opacity:1; pointer-events:none;
  }
  .pool.dropping .droplet{ animation:fall .5s cubic-bezier(.55,0,1,.45) forwards; }
  @keyframes fall{
    0%{ top:4%; opacity:1; }
    82%{ opacity:1; }
    100%{ top:60%; opacity:0; }
  }

  .ripple-ring{
    position:absolute; left:50%; top:62%; transform:translate(-50%,-50%);
    width:14px; height:14px; border-radius:50%;
    border:1.5px solid rgba(230,201,138,.55);
    opacity:0; pointer-events:none;
  }
  .pool.rippling .ripple-ring{ animation:ripple 1s ease-out forwards; }
  .pool.rippling .r2{ animation-delay:.15s; }
  .pool.rippling .r3{ animation-delay:.3s; }
  @keyframes ripple{
    0%{ width:14px; height:14px; opacity:.7; }
    100%{ width:220px; height:68px; opacity:0; }
  }

  .card{
    position:absolute; left:50%; top:48%; transform:translate(-50%,-50%);
    width:min(480px, 92vw); padding:3.4vh 36px 3.2vh; border-radius:17px; text-align:left;
    background:rgba(10,13,12,0.6); border:1px solid rgba(230,201,138,0.28); backdrop-filter:blur(14px);
    opacity:0; pointer-events:none;
    transition:opacity .55s ease .35s, transform .55s ease .35s;
    font-family:'Inter',sans-serif;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  .pool.is-on .card{ opacity:1; pointer-events:auto; transform:translate(-50%,-50%) translateY(0); }
  .card.shake{ animation:shake .4s ease; }
  @keyframes shake{
    20%{margin-left:-6px;} 40%{margin-left:6px;} 60%{margin-left:-4px;} 80%{margin-left:4px;} 100%{margin-left:0;}
  }

  .card h3{ margin:0 0 8px; font-family:'Fraunces',serif; font-weight:500; font-size:clamp(24px,3.8vh,33px); color:var(--ink); }
  .card-sub{ margin:0 0 2vh; font-family:'Inter',sans-serif; font-weight:300; font-size:clamp(13px,1.7vh,15.5px); color:var(--muted); }
  .card label{ display:block; font-size:clamp(12px,1.45vh,14px); color:var(--muted); margin:1.4vh 0 6px; }
  .card input{
    width:100%; padding:1.4vh 16px; border-radius:10px; border:1.5px solid rgba(230,201,138,.3);
    background:rgba(255,255,255,.05); color:var(--ink); font-size:clamp(14.5px,1.85vh,17px); font-family:'Inter',sans-serif;
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .card input::placeholder{ color:rgba(243,241,234,.4); }
  .card input:focus{
    outline:none; border-color:var(--accent); background:rgba(255,255,255,.08);
    box-shadow:0 0 0 4px rgba(230,201,138,.2);
  }
  .card button{
    margin-top:2.2vh; width:100%; padding:1.4vh; border:none; border-radius:10px; background:var(--accent);
    color:#1c1608; font-weight:600; font-size:clamp(14.5px,1.85vh,17px); cursor:pointer; transition:opacity .2s ease, transform .1s ease;
    font-family:'Inter',sans-serif;
  }
  .card button:hover{ opacity:.9; }
  .card button:active{ transform:scale(.98); }
  .card button:disabled{ opacity:.5; cursor:default; transform:none; }
  .error-msg{
    margin-top:10px; font-size:11px; color:#ffd9d0; background:rgba(120,20,10,.35);
    border:1px solid rgba(255,120,90,.4); border-radius:8px; padding:7px 9px; display:none;
  }
  .error-msg.show{ display:block; }

  .divider{
    display:flex; align-items:center; gap:10px; margin:1.4vh 0 1vh;
    font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;
    font-family:'IBM Plex Mono',monospace;
  }
  .divider::before, .divider::after{ content:''; flex:1; height:1px; background:rgba(230,201,138,0.2); }
  #googleBtnContainer{ display:flex; justify-content:center; min-height:58px; margin:4px 0; transform:scale(1.2); transform-origin:center; }

  .hint{ margin-top:16px; font-size:12px; color:var(--muted); font-family:'IBM Plex Mono',monospace; letter-spacing:.05em; }
  .hint b{ color:var(--ink); }
</style>
</head>
<body>

<video id="bg-video" autoplay muted loop playsinline
  src="https://zxdefgavgwfxastwmmjm.supabase.co/storage/v1/object/public/assets/terra.mp4">
</video>
<div class="vignette"></div>
<div class="scrim"></div>

<div class="shell">
  <nav class="nav rise" style="animation-delay:0ms">
    <div class="wordmark">AGENTIC <em>AI</em></div>
  </nav>

  <div class="hero">
    <p class="eyebrow rise" style="animation-delay:260ms"><span class="dot"></span><span id="eyebrowText">SECURE ACCESS</span></p>
    <h1 class="rise" id="greeting" style="animation-delay:380ms">Welcome to <em>Intelligence.</em></h1>
    <p class="sub rise" style="animation-delay:560ms">Your customer intelligence workspace awaits.</p>

    <div class="pool rise" id="pool" style="animation-delay:720ms">
      <div class="water-surface"></div>
      <div class="ripple-ring r1"></div>
      <div class="ripple-ring r2"></div>
      <div class="ripple-ring r3"></div>
      <div class="droplet" id="droplet"></div>

      <div class="card" id="card">
        <h3>Access your workspace.</h3>
        <p class="card-sub">Continue securely to your AI-powered workspace.</p>
        <form id="loginForm" autocomplete="on">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required />
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required />
          <button type="submit" id="submitBtn">Continue</button>
          <div class="error-msg" id="errorMsg"></div>
        </form>

        <div class="divider" id="googleDivider" style="display:none;">
          <span>or</span>
        </div>
        <div id="googleBtnContainer"></div>
      </div>
    </div>
  </div>

  <p class="footer-caption rise" style="animation-delay:900ms">Powered by AI · Built for Intelligence</p>
</div>

<script>
  /* ---------------- sign-in widget logic ---------------- */
  const poolEl = document.getElementById('pool');
  const form = document.getElementById('loginForm');
  const card = document.getElementById('card');
  const errorMsg = document.getElementById('errorMsg');
  const submitBtn = document.getElementById('submitBtn');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');

  fetch('/api/session', { credentials: 'same-origin' })
    .then(r => r.json())
    .then(d => { if (d.authenticated) window.location.href = '/'; })
    .catch(() => {});

  emailInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      passwordInput.focus();
    }
  });

  // Synced to the ACTUAL video, not a guessed timer: the ripple/card
  // sequence fires when the background video's own clock reaches the
  // moment its drop hits the water.
  //
  // >>> CALIBRATE THIS: watch the page, note the on-screen "video time"
  // readout at the exact instant the drop visibly hits the water in your
  // video, then set IMPACT_TIME_SECONDS to that number. Set
  // DEBUG_SHOW_VIDEO_TIME to false once you're done. <<<
  const IMPACT_TIME_SECONDS = -100;
  const DEBUG_SHOW_VIDEO_TIME = false;

  const bgVideo = document.getElementById('bg-video');
  let debugEl = null;
  if (DEBUG_SHOW_VIDEO_TIME) {
    debugEl = document.createElement('div');
    debugEl.style.cssText = 'position:fixed;bottom:12px;left:12px;z-index:999;background:rgba(0,0,0,.75);color:#e6c98a;font:12px "IBM Plex Mono",monospace;padding:7px 11px;border-radius:6px;pointer-events:none;';
    document.body.appendChild(debugEl);
  }

  let dropTriggered = false;
  bgVideo.addEventListener('timeupdate', () => {
    if (debugEl) {
      debugEl.textContent = 'video time: ' + bgVideo.currentTime.toFixed(2) + 's  (impact set to ' + IMPACT_TIME_SECONDS + 's)';
    }
    if (!dropTriggered && bgVideo.currentTime >= IMPACT_TIME_SECONDS) {
      dropTriggered = true;
      poolEl.classList.add('dropping');
      setTimeout(() => {
        poolEl.classList.add('rippling');
        poolEl.classList.add('is-on');
      }, 480); // matches the .droplet fall animation duration
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.classList.remove('show');

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 8000);

    try {
      console.log('[login] sending POST /api/login for', email);
      const res = await fetch('/api/login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
        signal: controller.signal,
      });
      clearTimeout(timeoutId);
      console.log('[login] got response, status', res.status);
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.detail || 'Sign in failed.');
      }

      submitBtn.textContent = 'Welcome ✓';
      setTimeout(() => { window.location.href = '/'; }, 350);
    } catch (err) {
      clearTimeout(timeoutId);
      console.error('[login] request failed:', err);
      if (err.name === 'AbortError') {
        errorMsg.textContent = 'The request timed out — no response from the server after 8s.';
      } else {
        errorMsg.textContent = err.message || 'Something went wrong. Try again.';
      }
      errorMsg.classList.add('show');
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Continue';
    }
  });

  function handleGoogleCredential(response) {
    console.log('[login] got Google credential, sending POST /api/login/google');
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 8000);

    fetch('/api/login/google', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ credential: response.credential }),
      signal: controller.signal,
    })
      .then(async (res) => {
        clearTimeout(timeoutId);
        console.log('[login] Google login response, status', res.status);
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Google sign-in failed.');
        window.location.href = '/';
      })
      .catch((err) => {
        clearTimeout(timeoutId);
        console.error('[login] Google login failed:', err);
        errorMsg.textContent = err.name === 'AbortError'
          ? 'The request timed out — no response from the server.'
          : err.message;
        errorMsg.classList.add('show');
      });
  }

  fetch('/api/config', { credentials: 'same-origin' })
    .then(r => r.json())
    .then(cfg => {
      if (!cfg.google_client_id) return;

      function setupGoogleButton(attemptsLeft) {
        if (typeof google === 'undefined' || !google.accounts) {
          if (attemptsLeft > 0) return setTimeout(() => setupGoogleButton(attemptsLeft - 1), 150);
          return;
        }
        google.accounts.id.initialize({
          client_id: cfg.google_client_id,
          callback: handleGoogleCredential,
        });
        document.getElementById('googleDivider').style.display = 'flex';
        google.accounts.id.renderButton(
          document.getElementById('googleBtnContainer'),
          { theme: 'filled_black', size: 'large', shape: 'pill', width: 330 }
        );
      }
      setupGoogleButton(20);
    })
    .catch(() => {});
</script>

</body>
</html>
